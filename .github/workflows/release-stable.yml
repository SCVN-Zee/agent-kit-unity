name: Release stable

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

permissions:
  contents: write

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical repository and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "SCVN-Zee/agent-kit-unity" ]; then
            echo "release refused outside SCVN-Zee/agent-kit-unity" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate stable tag and package versions
        run: node scripts/build-release.cjs "$GITHUB_REF_NAME" --channel stable --validate-only

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify repository
        run: make check

      - name: Build immutable release assets
        run: node scripts/build-release.cjs "$GITHUB_REF_NAME" --channel stable

      - name: Publish verified stable release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          find_release() {
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > release-pages.json || return 1
            node -e "
              const fs = require('fs');
              const tag = process.argv[1];
              const matches = JSON.parse(fs.readFileSync('release-pages.json')).flat()
                .filter((release) => release.tag_name === tag);
              if (matches.length === 0) process.exit(4);
              if (matches.length !== 1) throw Error('multiple releases found for ' + tag);
              fs.writeFileSync('release-state.json', JSON.stringify(matches[0]));
            " "$tag"
          }
          assert_draft() {
            node -e "const s=require('./release-state.json'); if(!s.draft||s.prerelease) throw Error('release must be a stable draft')"
          }
          if find_release; then
            assert_draft
          else
            status=$?
            if [ "$status" -ne 4 ]; then exit "$status"; fi
            gh release create "$tag" --verify-tag --draft --generate-notes \
              --title "Agent Kit Unity $tag"
          fi
          find_release || { echo 'draft disappeared before upload' >&2; exit 1; }
          assert_draft

          archive="dist/release/agent-kit-unity-${tag}.tgz"
          gh release upload "$tag" \
            dist/release/install.sh "$archive" dist/release/SHA256SUMS --clobber
          expected="$(printf '%s\n' SHA256SUMS "$(basename "$archive")" install.sh | LC_ALL=C sort)"
          actual="$(gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'asset mismatch\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false --prerelease=false --latest
